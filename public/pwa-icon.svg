<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Professional Dark Tech Blue -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Metallic Crisp White Gradient for Bowl -->
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Subtle Blue Accent for Tech Ring & Rupee -->
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Vibrant Emerald Green Accent for Checkmark Badge -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base App Icon Frame -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#334155" stroke-width="4" opacity="0.6" />

  <!-- Outer Tech Ring (Subtle Blue Glow) -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#blueAccent)" stroke-width="5" opacity="0.25" />
  <circle cx="256" cy="256" r="160" fill="#0f172a" stroke="#1e293b" stroke-width="8" />

  <!-- MINIMAL FOOD BOWL / PLATE (Clean Crisp White) -->
  <!-- Bowl Rim Ellipse -->
  <ellipse cx="256" cy="216" rx="115" ry="26" fill="none" stroke="url(#bowlGrad)" stroke-width="14" stroke-linecap="round"/>
  
  <!-- Bowl Base Body (Tapered Sleek Curve) -->
  <path d="M 143 218 C 147 312, 198 342, 256 342 C 314 342, 365 312, 369 218 Z" fill="url(#bowlGrad)"/>
  <!-- Inner shadow line on bowl -->
  <path d="M 155 222 C 159 298, 202 326, 256 326 C 310 326, 353 298, 357 222 Z" fill="#0f172a" opacity="0.12"/>

  <!-- SUBTLE RUPEE SYMBOL (₹) Etched cleanly inside the bowl -->
  <g transform="translate(256, 268) scale(1.15)" stroke="url(#blueAccent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top Horizontal Bar -->
    <line x1="-16" y1="-22" x2="16" y2="-22" />
    <!-- Middle Horizontal Bar -->
    <line x1="-16" y1="-10" x2="14" y2="-10" />
    <!-- Curved Stem -->
    <path d="M -10 -22 L -10 -10 C -2 -10, 8 -10, 8 0 C 8 10, -4 10, -10 10" />
    <!-- Diagonal Leg -->
    <line x1="-6" y1="8" x2="14" y2="26" />
  </g>

  <!-- VIBRANT GREEN CHECKMARK BADGE (Tracking Indicator) -->
  <g transform="translate(328, 178)" filter="url(#softGlow)">
    <circle cx="0" cy="0" r="40" fill="#0f172a" stroke="url(#greenGrad)" stroke-width="6" />
    <circle cx="0" cy="0" r="34" fill="url(#greenGrad)" />
    <!-- White Checkmark -->
    <path d="M -13 0 L -4 9 L 13 -9" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
