<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#1e293b" stroke-width="8" />

  <!-- Outer Plate Glow Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#10b981" stroke-width="6" opacity="0.25" filter="url(#glow)" />
  <circle cx="256" cy="256" r="160" fill="#0f172a" stroke="url(#emeraldGrad)" stroke-width="12" />

  <!-- Inner Plate Rim -->
  <circle cx="256" cy="256" r="115" fill="none" stroke="#059669" stroke-width="4" stroke-dasharray="8 8" opacity="0.6" />

  <!-- Fork (Left) -->
  <g transform="translate(195, 256)">
    <path d="M-12,-65 L-12,-15 Q-12,0 0,0 Q12,0 12,-15 L12,-65" fill="none" stroke="url(#emeraldGrad)" stroke-width="7" stroke-linecap="round" />
    <line x1="-4" y1="-65" x2="-4" y2="-10" stroke="url(#emeraldGrad)" stroke-width="6" stroke-linecap="round" />
    <line x1="4" y1="-65" x2="4" y2="-10" stroke="url(#emeraldGrad)" stroke-width="6" stroke-linecap="round" />
    <line x1="0" y1="0" x2="0" y2="70" stroke="url(#emeraldGrad)" stroke-width="9" stroke-linecap="round" />
  </g>

  <!-- Spoon (Right) -->
  <g transform="translate(317, 256)">
    <ellipse cx="0" cy="-35" rx="18" ry="30" fill="url(#emeraldGrad)" />
    <line x1="0" y1="-5" x2="0" y2="70" stroke="url(#emeraldGrad)" stroke-width="9" stroke-linecap="round" />
  </g>

  <!-- Center Checkmark Badge -->
  <circle cx="256" cy="310" r="32" fill="#10b981" />
  <path d="M244 310 L252 318 L268 300" fill="none" stroke="#020617" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
</svg>
